# Local development stack. Ports are bound to 127.0.0.1 only; credentials are dev defaults.
# Usage: docker compose -f infra/docker-compose.yml up -d
name: feeltriva
services:
  postgres:
    image: pgvector/pgvector:pg18
    # tini runs as process 1 and reaps orphaned processes. Without it PostgreSQL is process 1,
    # adopts any orphan (for example a health probe whose shell was killed on timeout) and treats
    # that orphan exiting with a code other than 0 or 1 as a crash: it then terminates every
    # connection and restarts. That happened twice during bulk loads (engineering log, BUG-005).
    init: true
    # Docker's default /dev/shm is 64 MB. PostgreSQL parallel queries allocate their shared hash
    # tables there, and a large aggregate fails with "could not resize shared memory segment ...
    # No space left on device" (engineering log, BUG-012).
    shm_size: "2gb"
    # Development settings for bulk dataset loads. Not production tuning.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_wal_size=2GB", "-c", "checkpoint_timeout=10min", "-c", "maintenance_work_mem=256MB"]
    environment:
      POSTGRES_USER: feeltriva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feeltriva_dev}
      POSTGRES_DB: feeltriva
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Exec form (no shell to be killed and leave an orphan) and a timeout that tolerates load.
      test: ["CMD", "pg_isready", "-U", "feeltriva", "-d", "feeltriva", "-t", "5"]
      interval: 15s
      timeout: 20s
      retries: 20

  # Private S3-compatible object storage for raw archives/manifests (no public buckets).
  objectstore:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_USER:-feeltriva}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_PASSWORD:-feeltriva_dev_storage}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - objectdata:/data
    profiles: ["storage"]

  # Optional queue/cache for future ingestion and embedding workers. Not session state.
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6390:6379"
    profiles: ["worker"]

volumes:
  pgdata:
  objectdata:
